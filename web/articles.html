<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分析框架 · 知识库 · LLM Gateway Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body class="reading">
<nav><div class="wrap">
  <div class="logo">LLM Gateway Bench</div>
  <a class="lnk" href="index.html#leaderboard">排行榜</a>
  <a class="lnk" href="index.html#fingerprint">行为体检</a>
  <a class="lnk" href="articles.html">分析框架</a>
  <div class="right"><a class="lnk" href="index.html">← 返回平台</a></div>
</div></nav>

<header><div class="wrap">
  <h1>分析框架 · 知识库</h1>
  <p class="lead">怎么判断一个网关靠不靠谱——把拨测数据读懂的方法论。建议按顺序读：先建立选型总框架，再逐项深入。每篇都只引用平台真实测量的行为指纹，可用自己的 key 复现。</p>
</div></header>

<div class="wrap"><div class="list" id="list"><div class="err">加载中…</div></div></div>

<footer><div class="wrap">
  <p>文章与拨测数据均开源、可复现 · <a href="index.html">返回排行榜</a></p>
</div></footer>

<script>
const esc = (s)=> String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
(async function(){
  const el = document.getElementById('list');
  try {
    const list = await fetch('articles.json', {cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; return r.json(); });
    if(!list.length){ el.innerHTML='<div class="err">文章即将上线。</div>'; return; }
    el.innerHTML = list.map((a,i)=>`<div class="item">
      <div class="idx-num">${String(i+1).padStart(2,'0')}</div>
      <div class="body">
        <h2><a href="article.html?slug=${encodeURIComponent(a.slug)}">${esc(a.title)}</a></h2>
        <p>${esc(a.summary||'')}</p>
        <div class="tags">${(a.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
          ${a.date?`<span class="date">${esc(a.date)}</span>`:''}</div>
      </div>
    </div>`).join('');
  } catch {
    el.innerHTML='<div class="err">文章列表需起本地服务（npm run serve）后查看。<a href="index.html">返回平台</a></div>';
  }
})();
</script>
</body>
</html>
