<!DOCTYPE html>
<html lang="zh-CN">

<body class="reading">

</div></nav>

<div class="wrap"><article id="art"><div class="err">加载中…</div></article></div>

<footer><div class="wrap">
  <p>MIT License · 文章与拨测数据均开源，可用自己的 key 复现 · <a href="index.html">返回排行榜</a></p>
</div></footer>

<script>
// 极简 Markdown 渲染器（文章为仓库内一手内容；仍先转义 HTML 再渲染受控子集）
const esc = (s)=> String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, (_,c)=>`<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_,t,u)=>{
      const safe = /^https?:\/\//.test(u) ? u : /^[a-z0-9-]+$/.test(u) ? `article.html?slug=${u}` : '#';
      const ext = /^https?:/.test(u) ? ' target="_blank" rel="noopener"' : '';
      return `<a href="${safe}"${ext}>${t}</a>`;
    });
}
function renderMd(md){
  const lines = md.replace(/\r/g,'').split('\n');
  let html='', i=0, list=null;
  const closeList=()=>{ if(list){ html+=`</${list}>`; list=null; } };
  while(i<lines.length){
    let ln = lines[i];
    if(ln.startsWith('```')){ closeList(); let code=''; i++;
      while(i<lines.length && !lines[i].startsWith('```')){ code+=lines[i]+'\n'; i++; }
      html+=`<pre><code>${esc(code.replace(/\n$/,''))}</code></pre>`; i++; continue; }
    if(/^#{1,3}\s/.test(ln)){ closeList(); const lvl=ln.match(/^#+/)[0].length;
      const t=ln.replace(/^#+\s/,''); html+= lvl===1?`<h2>${inline(t)}</h2>`:`<h${lvl}>${inline(t)}</h${lvl}>`; i++; continue; }
    if(/^>\s?/.test(ln)){ closeList(); let q=''; while(i<lines.length && /^>\s?/.test(lines[i])){ q+=lines[i].replace(/^>\s?/,'')+' '; i++; }
      html+=`<blockquote><p>${inline(q.trim())}</p></blockquote>`; continue; }
    if(/^[-*]\s/.test(ln)){ if(list!=='ul'){ closeList(); list='ul'; html+='<ul>'; } html+=`<li>${inline(ln.replace(/^[-*]\s/,''))}</li>`; i++; continue; }
    if(/^\d+\.\s/.test(ln)){ if(list!=='ol'){ closeList(); list='ol'; html+='<ol>'; } html+=`<li>${inline(ln.replace(/^\d+\.\s/,''))}</li>`; i++; continue; }
    if(/^(---|\*\*\*)\s*$/.test(ln)){ closeList(); html+='<hr>'; i++; continue; }
    if(ln.trim()===''){ closeList(); i++; continue; }
    closeList(); html+=`<p>${inline(ln)}</p>`; i++;
  }
  closeList(); return html;
}

(async function(){
  const slug = new URLSearchParams(location.search).get('slug') || '';
  const el = document.getElementById('art');
  if(!/^[a-z0-9-]+$/.test(slug)){ el.innerHTML='<div class="err">文章不存在。<a href="articles.html">返回文章列表</a></div>'; return; }
  try {
    const [md, manifest] = await Promise.all([
      fetch(`articles/${slug}.md`, {cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; return r.text(); }),
      fetch('articles.json', {cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[]),
    ]);
    const meta = (manifest||[]).find(a=>a.slug===slug) || {};
    document.title = (meta.title||slug) + ' · LLM Gateway Bench';
    const tags = (meta.tags||[]).map(t=>`<span class="a-tag">${esc(t)}</span>`).join('');
    const related = (manifest||[]).filter(a=>a.slug!==slug).slice(0,5)
      .map(a=>`<a href="article.html?slug=${encodeURIComponent(a.slug)}">${esc(a.title)} <span style="color:var(--faint)">— ${esc(a.summary||'')}</span></a>`).join('');
    el.innerHTML = `<a class="back" href="articles.html">← 分析框架</a>
      <h1>${esc(meta.title||slug)}</h1>
      <div class="a-meta">${esc(meta.date||'')}</div>
      <div class="a-tags">${tags}</div>
      <div class="md">${renderMd(md)}</div>
      ${related?`<div class="related"><h3>继续阅读</h3>${related}</div>`:''}`;
  } catch {
    el.innerHTML='<div class="err">文章加载失败（请用 npm run serve 起本地服务后访问）。<a href="articles.html">返回文章列表</a></div>';
  }
})();
</script>
</body>
</html>
