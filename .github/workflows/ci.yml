# Run unit tests + an aggregate smoke test on every push / PR, giving contributors instant feedback and blocking bad changes.
# Complements the 6-hourly probe.yml: that one runs real probes, this one only verifies the code and curated data are correct,
# and needs no API key.
name: ci
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # checkout/setup-node v4 defaults to Node20, deprecated from 2026-06-16
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (metrics / aggregate / prices / probe / data contracts)
        run: npm test
      - name: Aggregate smoke (aggregation doesn't crash + produces web/data.json, web/models.json, web/report.mjs)
        run: |
          node probe/aggregate.mjs
          test -s web/data.json || { echo 'web/data.json not generated or empty'; exit 1; }
          test -s web/models.json || { echo 'web/models.json not generated or empty'; exit 1; }
          test -s web/report.mjs || { echo 'web/report.mjs not mirrored or empty'; exit 1; }
          diff -q probe/report.mjs web/report.mjs || { echo 'web/report.mjs differs from probe/report.mjs (please re-run aggregate and commit)'; exit 1; }
      - name: JS syntax check (probe/*.mjs + scripts/*.mjs)
        run: for f in probe/*.mjs scripts/*.mjs; do node --check "$f"; done
