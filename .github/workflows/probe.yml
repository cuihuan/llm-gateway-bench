# Periodic dial-test of all configured gateways, committed back to data/results/.
# Keys live ONLY in repo secrets (Settings → Secrets → Actions). A gateway whose
# secret is absent is skipped, never failed.
name: probe
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # checkout/setup-node v4 默认 Node20，2026-06-16 起弃用
on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

# 串行化：手动触发撞上 cron、或慢任务撞上下一次 cron 时排队而不是并行竞争 git push
concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
      - name: Dial-test all gateways
        env:
          SYNTHORAI_API_KEY: ${{ secrets.SYNTHORAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          OHMYGPT_API_KEY: ${{ secrets.OHMYGPT_API_KEY }}
          CLOSEAI_API_KEY: ${{ secrets.CLOSEAI_API_KEY }}
          PROBE_REGION: gh-us
        run: node probe/probe.mjs --samples 3 --out data/results
      - name: Refresh price snapshot
        continue-on-error: true # 价格源临时不可用时沿用上一份快照，不阻塞拨测
        run: node probe/prices.mjs
      - name: Aggregate into web/data.json
        run: node probe/aggregate.mjs
      - name: Commit results
        run: |
          git config user.name 'gateway-bench-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/results data/prices.json web/data.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: probe run $(date -u +%FT%TZ)"
          git pull --rebase origin main   # 远端推进过也不丢本次拨测数据
          git push
