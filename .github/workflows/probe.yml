# Periodic dial-test of all configured gateways, committed back to data/results/.
# Keys live ONLY in repo secrets (Settings → Secrets → Actions). A gateway whose
# secret is absent is skipped, never failed.
name: probe
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # checkout/setup-node v4 defaults to Node20, deprecated from 2026-06-16
on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

# Serialize: when a manual trigger collides with cron, or a slow run collides with the next cron, queue instead of racing git push in parallel
concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Each gateway key is promoted to job level, shared by both the probe and the matrix cross-comparison steps (gateways missing a key are skipped automatically).
    env:
      SYNTHORAI_API_KEY: ${{ secrets.SYNTHORAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      OHMYGPT_API_KEY: ${{ secrets.OHMYGPT_API_KEY }}
      CLOSEAI_API_KEY: ${{ secrets.CLOSEAI_API_KEY }}
      PROBE_REGION: gh-us
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
      - name: Dial-test all gateways
        run: node probe/probe.mjs --samples 3 --out data/results
      - name: Refresh price snapshot
        continue-on-error: true # when the price source is temporarily unavailable, keep the previous snapshot and don't block the probe
        run: node probe/prices.mjs
      - name: Aggregate into web/data.json
        run: node probe/aggregate.mjs
      - name: Build classic-model × gateway matrices (flagship reports for the report gallery, generated only with >=2 gateways)
        continue-on-error: true # a matrix failure must not block committing probe data
        run: node probe/matrix.mjs --samples 3
      - name: Commit results
        run: |
          git config user.name 'gateway-bench-bot'
          git config user.email 'actions@users.noreply.github.com'
          # aggregate.mjs also mirrors data/fidelity.json + data/xformat.json into
          # web/ and regenerates web/fidelity-scatter.svg; stage those too, or the
          # unstaged changes make `git pull --rebase` abort (exit 128).
          git add data/results data/prices.json web/data.json web/models.json web/report.mjs web/reports web/fidelity.json web/xformat.json web/fidelity-scatter.svg
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: probe run $(date -u +%FT%TZ)"
          git pull --rebase origin main   # don't lose this probe's data even if the remote moved on
          git push
