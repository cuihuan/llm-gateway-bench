# Deploys web/ to GitHub Pages on every push that touches it.
# Pages source must be set to "GitHub Actions" (Settings → Pages, or enabled via API).
name: pages
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # checkout v4 defaults to Node20, deprecated from 2026-06-16
on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
