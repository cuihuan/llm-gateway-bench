name: Gateway overhead + fidelity

# Measures the per-request latency each self-hosted gateway adds on top of a
# direct call to a local mock OpenAI upstream (no API keys, no egress, ~free).
# Sequential + interleaved rounds; median-of-round-medians. NOT a load test.
# Canonical numbers come from this neutral runner; see docs/methodology.md.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 3 * *'   # monthly, 3rd day 03:41 UTC

permissions:
  contents: write

concurrency:
  group: overhead
  cancel-in-progress: false

jobs:
  overhead:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Unit tests (harness sanity)
        run: node --test probe/overhead.test.mjs

      - name: Install LiteLLM proxy
        run: |
          pip install --quiet 'litellm[proxy]'
          litellm --version

      - name: Start LiteLLM against the mock upstream
        run: |
          # the measurement CLI starts its own mock on 9010; litellm just needs the URL
          OPENAI_API_KEY=sk-mock nohup litellm --model openai/mock-model \
            --api_base http://127.0.0.1:9010/v1 --port 4000 > /tmp/litellm.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://127.0.0.1:4000/health/liveliness && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4000/health/liveliness || { tail -50 /tmp/litellm.log; exit 1; }

      - name: Measure LiteLLM overhead
        run: |
          VERSION=$(litellm --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          node probe/overhead.mjs --gateway litellm \
            --gateway-url http://127.0.0.1:4000/v1/chat/completions \
            --api-key sk-mock --gateway-version "$VERSION" \
            --rounds 7 --per-round 25 --warmup 15 --out data/overhead.json

      - name: Start Portkey Gateway (OSS)
        run: |
          nohup npx -y @portkey-ai/gateway > /tmp/portkey.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8787/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8787/ || { tail -50 /tmp/portkey.log; exit 1; }

      - name: Measure Portkey overhead
        run: |
          VERSION=$(npm view @portkey-ai/gateway version)
          node probe/overhead.mjs --gateway portkey-oss \
            --gateway-url http://127.0.0.1:8787/v1/chat/completions \
            --api-key sk-mock \
            --header 'x-portkey-provider: openai' \
            --header 'x-portkey-custom-host: http://127.0.0.1:9010/v1' \
            --gateway-version "$VERSION" \
            --rounds 7 --per-round 25 --warmup 15 --out data/overhead.json

      - name: Start Bifrost (docker, host network for fairness)
        run: |
          mkdir -p /tmp/bifrost-data
          cat > /tmp/bifrost-data/config.json <<'CFG'
          {
            "providers": {
              "openai": {
                "keys": [{"name": "mock", "value": "sk-mock", "models": ["mock-model"], "weight": 1.0}],
                "network_config": {"base_url": "http://127.0.0.1:9010/v1", "allow_private_network": true}
              }
            }
          }
          CFG
          chmod -R 777 /tmp/bifrost-data
          docker run -d --name bifrost --network host -v /tmp/bifrost-data:/app/data maximhq/bifrost
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/metrics && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8080/metrics || { docker logs bifrost | tail -50; exit 1; }

      - name: Measure Bifrost overhead
        run: |
          DIGEST=$(docker image inspect maximhq/bifrost --format '{{index .RepoDigests 0}}' | grep -oE 'sha256:[a-f0-9]{12}' | head -1)
          node probe/overhead.mjs --gateway bifrost \
            --gateway-url http://127.0.0.1:8080/v1/chat/completions \
            --model openai/mock-model \
            --gateway-version "docker-${DIGEST:-latest}" \
            --rounds 7 --per-round 25 --warmup 15 --out data/overhead.json

      # ---- protocol-translation fidelity (reuses the same running gateways + mock port) ----
      - name: Fidelity — LiteLLM
        if: always()
        run: |
          V=$(litellm --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          node probe/fidelity.mjs --gateway litellm --gateway-url http://127.0.0.1:4000/v1/chat/completions \
            --api-key sk-mock --gateway-version "$V" --mock-port 9010 --out data/fidelity.json || true

      - name: Fidelity — Portkey OSS
        if: always()
        run: |
          V=$(npm view @portkey-ai/gateway version)
          node probe/fidelity.mjs --gateway portkey-oss --gateway-url http://127.0.0.1:8787/v1/chat/completions \
            --api-key sk-mock --header 'x-portkey-provider: openai' --header 'x-portkey-custom-host: http://127.0.0.1:9010/v1' \
            --gateway-version "$V" --mock-port 9010 --out data/fidelity.json || true

      - name: Fidelity — Bifrost
        if: always()
        run: |
          DIGEST=$(docker image inspect maximhq/bifrost --format '{{index .RepoDigests 0}}' | grep -oE 'sha256:[a-f0-9]{12}' | head -1)
          node probe/fidelity.mjs --gateway bifrost --gateway-url http://127.0.0.1:8080/v1/chat/completions \
            --model openai/mock-model --gateway-version "docker-${DIGEST:-latest}" --mock-port 9010 --out data/fidelity.json || true

      # ---- cross-format fidelity (Anthropic client -> OpenAI upstream) ----
      # The hardest translation path: an Anthropic-format client (Claude Code / the
      # Anthropic SDK) routed to an OpenAI upstream. Each gateway is driven through
      # its own Anthropic endpoint; the mock speaks both OpenAI Chat Completions and
      # the Responses API (newer gateways translate via /v1/responses).
      - name: Cross-format fidelity — LiteLLM
        if: always()
        run: |
          V=$(litellm --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          node probe/xformat.mjs --gateway litellm --messages-url http://127.0.0.1:4000/v1/messages \
            --api-key sk-mock --gateway-version "$V" --mock-port 9010 --out data/xformat.json || true

      - name: Cross-format fidelity — Bifrost
        if: always()
        run: |
          DIGEST=$(docker image inspect maximhq/bifrost --format '{{index .RepoDigests 0}}' | grep -oE 'sha256:[a-f0-9]{12}' | head -1)
          node probe/xformat.mjs --gateway bifrost --messages-url http://127.0.0.1:8080/anthropic/v1/messages \
            --api-key sk-mock --gateway-version "docker-${DIGEST:-latest}" --mock-port 9010 --out data/xformat.json || true

      # Portkey OSS: its /v1/messages is Anthropic-provider-only — with an OpenAI
      # provider it rejects the operation ("messages is not supported by openai"),
      # so this records INCONCLUSIVE with that snippet (it does NOT offer the
      # Anthropic-client -> OpenAI-upstream path in the header-config OSS mode).
      - name: Cross-format fidelity — Portkey OSS
        if: always()
        run: |
          V=$(npm view @portkey-ai/gateway version)
          node probe/xformat.mjs --gateway portkey-oss --messages-url http://127.0.0.1:8787/v1/messages \
            --api-key sk-mock --header 'x-portkey-provider: openai' --header 'x-portkey-custom-host: http://127.0.0.1:9010/v1' \
            --gateway-version "$V" --mock-port 9010 --out data/xformat.json || true

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/overhead.json data/fidelity.json data/xformat.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: gateway overhead + fidelity + xformat measurement ($(date -u +%F))"
          git pull --rebase origin main
          git push
